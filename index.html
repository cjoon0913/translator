<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실시간 AI 라이브 통역기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .mic-live-ring {
      animation: pulse-ring 2s infinite ease-in-out;
    }
    /* 모바일/PC 대화 스크롤바 커스텀 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- 헤더 영역 -->
  <header class="flex items-center justify-between px-4 py-3 bg-slate-900 border-b border-slate-800 z-10 shrink-0">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-language text-white text-base"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm leading-tight flex items-center gap-1.5">
          실시간 라이브 통역기
          <span id="liveBadge" class="hidden px-1.5 py-0.5 text-[10px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full animate-pulse">LIVE 수신중</span>
        </h1>
        <p class="text-[11px] text-slate-400" id="statusText">마이크를 켜면 연속 통역이 유지됩니다</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <!-- 도착 언어 선택 -->
      <select id="targetLang" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-indigo-500 transition">
        <option value="en">🇺🇸 영어 (EN)</option>
        <option value="ja">🇯🇵 일본어 (JA)</option>
        <option value="zh-CN">🇨🇳 중국어 (ZH)</option>
        <option value="es">🇪🇸 스페인어 (ES)</option>
      </select>
    </div>
  </header>

  <!-- 대화창 영역 -->
  <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
    <!-- 초기 안내 화면 -->
    <div id="emptyGuide" class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400">
      <div class="w-14 h-14 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-3 text-indigo-400 text-2xl">
        <i class="fa-solid fa-tower-broadcast"></i>
      </div>
      <h2 class="text-base font-semibold text-slate-200 mb-1">무한 연속 라이브 통역</h2>
      <p class="text-xs max-w-xs text-slate-400 leading-relaxed mb-4">
        하단 마이크를 켜면 유튜브 소리나 대화를 끊김 없이 계속 감지하여 실시간 자막을 생성합니다.
      </p>
    </div>

    <!-- 대화 메시지가 추가되는 컨테이너 -->
    <div id="messagesList" class="space-y-4"></div>
    <div id="scrollAnchor" class="h-2"></div>
  </main>

  <!-- 하단 고정 컨트롤 바 -->
  <footer class="p-3 bg-slate-900 border-t border-slate-800 shrink-0">
    <div class="max-w-3xl mx-auto flex items-center gap-2">
      <!-- 무한 마이크 토글 버튼 -->
      <div class="relative shrink-0">
        <button id="micBtn" class="w-11 h-11 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center justify-center transition-all shadow-md focus:outline-none">
          <i class="fa-solid fa-microphone text-base"></i>
        </button>
        <span id="micRing" class="hidden absolute -inset-1 rounded-full border-2 border-red-500 mic-live-ring pointer-events-none"></span>
      </div>

      <!-- 텍스트 수동 입력창 -->
      <div class="relative flex-1">
        <input type="text" id="textInput" placeholder="마이크를 켜거나 직접 문장을 입력하세요..." 
          class="w-full bg-slate-950 border border-slate-700 rounded-full px-4 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition pr-10">
        <button id="sendBtn" class="absolute right-1.5 top-1.5 w-8 h-8 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const messagesList = document.getElementById('messagesList');
    const emptyGuide = document.getElementById('emptyGuide');
    const scrollAnchor = document.getElementById('scrollAnchor');
    const micBtn = document.getElementById('micBtn');
    const micRing = document.getElementById('micRing');
    const statusText = document.getElementById('statusText');
    const liveBadge = document.getElementById('liveBadge');
    const targetLangSelect = document.getElementById('targetLang');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');

    let recognition = null;
    let isContinuousListening = false; // 사용자가 끄기 전까지 계속 유지되는 상태 플래그
    let restartTimer = null;

    // 자연스러운 사전 (즉시 응답용)
    const quickDict = {
      en: { "안녕하세요": "Hello.", "반갑습니다": "Nice to meet you.", "감사합니다": "Thank you." },
      ja: { "안녕하세요": "こんにちは。", "반갑습니다": "お会いできて嬉しいです。", "감사합니다": "ありがとうございます。" }
    };

    // 실시간 NMT 번역 엔진
    async function translateText(text, targetLang) {
      if (quickDict[targetLang] && quickDict[targetLang][text.trim()]) {
        return quickDict[targetLang][text.trim()];
      }
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data[0]) {
          return data[0].map(item => item[0]).join('');
        }
      } catch (err) {
        console.warn('API 호출 대체:', err);
      }
      return text;
    }

    // 화면 자동 스크롤
    function scrollToBottom() {
      setTimeout(() => {
        scrollAnchor.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 50);
    }

    // 말풍선 렌더링
    async function createTranslationCard(originalText) {
      if (!originalText.trim()) return;
      emptyGuide.classList.add('hidden');

      const cardId = 'card-' + Date.now();
      const targetLang = targetLangSelect.value;
      const targetLangName = targetLangSelect.options[targetLangSelect.selectedIndex].text;

      const cardHtml = `
        <div id="${cardId}" class="flex flex-col space-y-2 border border-slate-800 bg-slate-900/60 rounded-xl p-3 shadow-sm animate-fade-in">
          <!-- 원문 (한국어) -->
          <div class="flex items-start justify-between gap-2 border-b border-slate-800/60 pb-2">
            <div class="flex items-center gap-1.5 text-[11px] text-slate-400 font-medium">
              <span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
              한국어 원문
            </div>
            <span class="text-[10px] text-slate-500">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</span>
          </div>
          <div class="text-xs text-slate-200 font-medium leading-relaxed">${originalText}</div>

          <!-- 번역문 -->
          <div class="pt-1">
            <div class="flex items-center justify-between text-[11px] text-indigo-400 font-medium mb-1">
              <span>${targetLangName}</span>
              <button onclick="navigator.clipboard.writeText(this.closest('#${cardId}').querySelector('.trans-result').innerText)" class="text-[10px] text-slate-500 hover:text-slate-300">
                <i class="fa-regular fa-copy"></i> 복사
              </button>
            </div>
            <div class="trans-result text-sm text-indigo-200 font-semibold leading-relaxed">
              <span class="inline-flex items-center gap-1 text-slate-400 text-xs">
                <i class="fa-solid fa-circle-notch fa-spin"></i> 번역 생성 중...
              </span>
            </div>
          </div>
        </div>
      `;

      messagesList.insertAdjacentHTML('beforeend', cardHtml);
      scrollToBottom();

      // 실제 번역 요청
      const translated = await translateText(originalText, targetLang);
      const cardElem = document.getElementById(cardId);
      if (cardElem) {
        cardElem.querySelector('.trans-result').innerText = translated;
        scrollToBottom();
      }
    }

    // 무한 음성 인식(STT) 초기화
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusText.innerText = "이 브라우저는 음성 인식을 지원하지 않습니다.";
        return null;
      }

      const recognizer = new SpeechRecognition();
      recognizer.lang = 'ko-KR';
      recognizer.continuous = true;     // 연속 인식
      recognizer.interimResults = false; // 문장이 완성되었을 때만 처리

      recognizer.onstart = () => {
        statusText.innerText = "라이브 음성을 감지하고 있습니다...";
        liveBadge.classList.remove('hidden');
        micBtn.classList.replace('bg-slate-800', 'bg-red-600');
        micBtn.classList.replace('text-slate-300', 'text-white');
        micRing.classList.remove('hidden');
      };

      recognizer.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            const transcript = event.results[i][0].transcript.trim();
            if (transcript.length > 0) {
              createTranslationCard(transcript);
            }
          }
        }
      };

      recognizer.onerror = (event) => {
        // 음성이 잠깐 안 들려서 생기는 'no-speech' 에러는 무시하고 계속 유지
        if (event.error !== 'no-speech') {
          console.log
