<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실시간 AI 라이브 통역기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020617;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.18); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .mic-live-ring {
      animation: pulse-ring 1.8s infinite ease-in-out;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="flex flex-col text-slate-100 font-sans" style="height: 100dvh;">

  <!-- 1. 헤더 영역 -->
  <header class="flex items-center justify-between px-4 py-2.5 bg-slate-900/90 backdrop-blur border-b border-slate-800 shrink-0 z-30">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center shadow-md shadow-indigo-500/20">
        <i class="fa-solid fa-language text-white text-sm"></i>
      </div>
      <div>
        <h1 class="font-bold text-xs leading-none flex items-center gap-1.5 text-slate-100">
          실시간 라이브 통역기
          <span id="liveBadge" class="hidden px-1.5 py-0.5 text-[9px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full animate-pulse">LIVE</span>
        </h1>
        <p class="text-[10px] text-slate-400 mt-1" id="statusText">마이크를 켜면 라이브 통역이 시작됩니다</p>
      </div>
    </div>
    
    <!-- 도착 언어 선택 -->
    <select id="targetLang" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-2 py-1.5 focus:outline-none focus:border-indigo-500">
      <option value="en">🇺🇸 영어 (EN)</option>
      <option value="ja">🇯🇵 일본어 (JA)</option>
      <option value="zh-CN">🇨🇳 중국어 (ZH)</option>
      <option value="es">🇪🇸 스페인어 (ES)</option>
    </select>
  </header>

  <!-- 2. 대화창 영역 -->
  <main id="chatContainer" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3">
    <!-- 초기 안내 화면 -->
    <div id="emptyGuide" class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400">
      <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-3 text-indigo-400 text-xl shadow-inner">
        <i class="fa-solid fa-tower-broadcast"></i>
      </div>
      <h2 class="text-sm font-semibold text-slate-200 mb-1">실시간 라이브 자막 통역</h2>
      <p class="text-xs max-w-xs text-slate-400 leading-relaxed mb-4">
        유튜브 방송이나 대화를 실시간으로 감지하여 문장 단위로 깔끔하게 정리하여 통역합니다.
      </p>
    </div>

    <!-- 카드 목록 -->
    <div id="messagesList" class="space-y-3"></div>
    <div id="scrollAnchor" class="h-1"></div>
  </main>

  <!-- 3. 하단 고정 컨트롤 바 -->
  <footer class="p-3 bg-slate-900 border-t border-slate-800 shrink-0 z-30" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
    <div class="max-w-xl mx-auto flex items-center gap-2">
      <!-- 마이크 토글 버튼 -->
      <div class="relative shrink-0">
        <button id="micBtn" class="w-11 h-11 rounded-full bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 border border-slate-700 flex items-center justify-center transition shadow-md">
          <i class="fa-solid fa-microphone text-base"></i>
        </button>
        <span id="micRing" class="hidden absolute -inset-1 rounded-full border-2 border-red-500 mic-live-ring pointer-events-none"></span>
      </div>

      <!-- 텍스트 직접 입력창 -->
      <div class="relative flex-1">
        <input type="text" id="textInput" placeholder="마이크를 켜거나 직접 문장을 입력하세요..." 
          class="w-full bg-slate-950 border border-slate-700 rounded-full px-4 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition pr-9">
        <button id="sendBtn" class="absolute right-1 top-1 w-7 h-7 rounded-full bg-indigo-600 active:bg-indigo-700 text-white flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const messagesList = document.getElementById('messagesList');
    const emptyGuide = document.getElementById('emptyGuide');
    const scrollAnchor = document.getElementById('scrollAnchor');
    const micBtn = document.getElementById('micBtn');
    const micRing = document.getElementById('micRing');
    const statusText = document.getElementById('statusText');
    const liveBadge = document.getElementById('liveBadge');
    const targetLangSelect = document.getElementById('targetLang');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');

    let recognition = null;
    let isContinuousListening = false;
    let restartTimer = null;

    // 실시간 제자리 업데이트 & 확정 제어 변수
    let activeCardId = null;
    let activeKoreanText = "";
    let silenceTimer = null;
    let translateDebounceTimer = null;
    let lastCommittedKorean = "";
    const SILENCE_COMMIT_MS = 1600; // 1.6초 동안 추가 음성이 없으면 문장 확정 완료

    // 실시간 NMT 번역 엔진
    async function translateText(text, targetLang) {
      if (!text || !text.trim()) return '';
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data[0]) {
          return data[0].map(item => item[0]).join('');
        }
      } catch (err) {
        console.warn('번역 API 호출 실패:', err);
      }
      return text;
    }

    function scrollToBottom() {
      setTimeout(() => {
        scrollAnchor.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 50);
    }

    // 새 활성 카드 생성
    function createActiveCard(initialText) {
      emptyGuide.classList.add('hidden');
      const cardId = 'card-' + Date.now();
      const targetLangName = targetLangSelect.options[targetLangSelect.selectedIndex].text;

      const cardHtml = `
        <div id="${cardId}" class="card-item flex flex-col space-y-1.5 border border-indigo-500/40 bg-slate-900/90 rounded-xl p-3 shadow-md transition-all">
          <div class="flex items-start justify-between gap-2 border-b border-slate-800 pb-1.5">
            <span class="text-[10px] text-indigo-400 font-medium flex items-center gap-1.5 status-label">
              <span class="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>실시간 수신 중...
            </span>
            <span class="text-[9px] text-slate-500 time-label">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</span>
          </div>
          <div class="korean-text text-xs text-slate-100 font-medium leading-relaxed">${initialText}</div>
          <div class="pt-1 border-t border-slate-800/40">
            <div class="flex items-center justify-between text-[10px] text-indigo-400 font-medium mb-0.5">
              <span>${targetLangName}</span>
              <button onclick="navigator.clipboard.writeText(this.closest('.card-item').querySelector('.trans-result').innerText)" class="text-[9px] text-slate-500 hover:text-slate-300">
                <i class="fa-regular fa-copy"></i> 복사
              </button>
            </div>
            <div class="trans-result text-xs text-indigo-200 font-semibold leading-relaxed">
              <span class="inline-flex items-center gap-1 text-slate-400 text-[11px]">
                <i class="fa-solid fa-circle-notch fa-spin"></i> 번역 준비 중...
              </span>
            </div>
          </div>
        </div>
      `;

      messagesList.insertAdjacentHTML('beforeend', cardHtml);
      scrollToBottom();
      return cardId;
    }

    // 기존 활성 카드 제자리 갱신 및 디바운스 번역
    function updateActiveCard(cardId, newText) {
      const cardElem = document.getElementById(cardId);
      if (!cardElem) return;

      const korElem = cardElem.querySelector('.korean-text');
      if (korElem) korElem.innerText = newText;
      scrollToBottom();

      // 말하는 도중 번역 API가 폭주하지 않도록 0.35초 디바운스 적용
      clearTimeout(translateDebounceTimer);
      translateDebounceTimer = setTimeout(async () => {
        const targetLang = targetLangSelect.value;
        const translated = await translateText(newText, targetLang);
        const transElem = cardElem.querySelector('.trans-result');
        if (transElem) {
          transElem.innerText = translated;
          scrollToBottom();
        }
      }, 350);
    }

    // 침묵 발생 시 카드 확정 (완료 처리)
    async function commitActiveCard() {
      if (!activeCardId) return;

      const cardElem = document.getElementById(activeCardId);
      if (cardElem) {
        // 실시간 수신 배지 제거하고 고정된 원문 라벨로 변경
        const statusLabel = cardElem.querySelector('.status-label');
        if (statusLabel) {
          statusLabel.className = 'text-[10px] text-slate-400 font-medium flex items-center gap-1';
          statusLabel.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>한국어 원문';
        }
        cardElem.classList.replace('border-indigo-500/40', 'border-slate-800');
        cardElem.classList.replace('bg-slate-900/90', 'bg-slate-900/70');

        // 확정 시점에 최종 번역이 누락되지 않도록 1회 확실하게 재보장
        const targetLang = targetLangSelect.value;
        const translated = await translateText(activeKoreanText, targetLang);
        const transElem = cardElem.querySelector('.trans-result');
        if (transElem && translated) {
          transElem.innerText = translated;
        }
      }

      lastCommittedKorean = activeKoreanText;
      activeCardId = null;
      activeKoreanText = "";
      clearTimeout(silenceTimer);
    }

    // 침묵 감지 타이머 재설정
    function resetSilenceTimer() {
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        commitActiveCard();
      }, SILENCE_COMMIT_MS);
    }

    // 수신된 음성 텍스트의 스마트 처리 (도배 방지 핵심 로직)
    function handleIncomingSpeech(incomingText) {
      const text = incomingText.trim();
      if (!text || text.length <= 1) return;

      // 직전에 이미 완료된 문장과 완전히 같거나 그 일부분이면 무시 (중복 이벤트 필터링)
      if (text === lastCommittedKorean || (lastCommittedKorean && lastCommittedKorean.endsWith(text))) {
        return;
      }

      if (activeCardId) {
        // 기존 텍스트의 확장("왜" -> "왜 다시" -> "왜 다시 금방")이거나 짧은 호흡 단위인 경우
        const isExtension = text.startsWith(activeKoreanText) || text.includes(activeKoreanText) || activeKoreanText.startsWith(text);

        if (isExtension || activeKoreanText.length < 12) {
          // 문장이 지나치게 길어지고(40자 이상) 문장 끝맺음이 확인되면 즉시 확정 후 분리
          const hasSentenceCloser = /[.?!]$\vert{}[가-힣]{2,}(?:다\vert{}요\vert{}죠\vert{}까\vert{}네)[.?!]?$/.test(text);
          if (text.length >= 40 && hasSentenceCloser) {
            activeKoreanText = text;
            updateActiveCard(activeCardId, text);
            commitActiveCard();
            return;
          }

          // 기존 카드 제자리 업데이트
          activeKoreanText = text;
          updateActiveCard(activeCardId, text);
          resetSilenceTimer();
          return;
        } else {
          // 명확하게 다른 새로운 문장이 시작되었으면 이전 카드를 닫고 새 카드로 진입
          commitActiveCard();
        }
      }

      // 새 카드 시작
      activeKoreanText = text;
      activeCardId = createActiveCard(text);
      updateActiveCard(activeCardId, text);
      resetSilenceTimer();
    }

    // 음성 인식 초기화
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusText.innerText = "이 브라우저는 음성 인식을 지원하지 않습니다.";
        return null;
      }

      const recognizer = new SpeechRecognition();
      recognizer.lang = 'ko-KR';
      recognizer.continuous = true;
      recognizer.interimResults = true;

      recognizer.onstart = () => {
        statusText.innerText = "라이브 음성을 감지 중입니다...";
        liveBadge.classList.remove('hidden');
        micBtn.classList.replace('bg-slate-800', 'bg-red-600');
        micBtn.classList.replace('text-slate-300', 'text-white');
        micRing.classList.remove('hidden');
      };

      recognizer.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        if (transcript.trim().length > 0) {
          handleIncomingSpeech(transcript);
        }
      };

      recognizer.onerror = (event) => {
        if (event.error !== 'no-speech') {
          console.log('마이크 상태:', event.error);
        }
      };

      recognizer.onend = () => {
        if (isContinuousListening) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            try { recognizer.start(); } catch (err) {}
          }, 120);
        } else {
          commitActiveCard();
          statusText.innerText = "마이크가 대기 상태입니다";
          liveBadge.classList.add('hidden');
          micBtn.classList.replace('bg-red-600', 'bg-slate-800');
          micBtn.classList.replace('text-white', 'text-slate-300');
          micRing.classList.add('hidden');
        }
      };

      return recognizer;
    }

    function toggleMic() {
      if (!recognition) {
        recognition = initSpeechRecognition();
        if (!recognition) return;
      }

      if (isContinuousListening) {
        isContinuousListening = false;
        recognition.stop();
        commitActiveCard();
      } else {
        isContinuousListening = true;
        try { recognition.start(); } catch (e) {}
      }
    }

    micBtn.addEventListener('click', toggleMic);

    // 텍스트 직접 입력 처리
    async function handleSend() {
      const text = textInput.value.trim();
      if (!text) return;
      commitActiveCard();
      
      const newId = createActiveCard(text);
      const targetLang = targetLangSelect.value;
      const trans = await translateText(text, targetLang);
      const card = document.getElementById(newId);
      if (card) {
        card.querySelector('.trans-result').innerText = trans;
        const statusLabel = card.querySelector('.status-label');
        if (statusLabel) {
          statusLabel.className = 'text-[10px] text-slate-400 font-medium flex items-center gap-1';
          statusLabel.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>한국어 원문';
        }
        card.classList.replace('border-indigo-500/40', 'border-slate-800');
        card.classList.replace('bg-slate-900/90', 'bg-slate-900/70');
      }
      textInput.value = '';
    }

    sendBtn.addEventListener('click', handleSend);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSend();
    });
  </script>
</body>
</html>
