<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실시간 AI 라이브 통역기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020617;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.18); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .mic-live-ring {
      animation: pulse-ring 1.8s infinite ease-in-out;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="flex flex-col text-slate-100 font-sans" style="height: 100dvh;">

  <!-- 헤더 영역 -->
  <header class="flex items-center justify-between px-4 py-2.5 bg-slate-900/90 backdrop-blur border-b border-slate-800 shrink-0 z-30">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center shadow-md shadow-indigo-500/20">
        <i class="fa-solid fa-satellite-dish text-white text-sm"></i>
      </div>
      <div>
        <h1 class="font-bold text-xs leading-none flex items-center gap-1.5 text-slate-100">
          YouTube 실시간 자동 통역
          <span id="serverBadge" class="px-1.5 py-0.5 text-[9px] font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded-full animate-pulse">서버 연결 중...</span>
        </h1>
        <p class="text-[10px] text-slate-400 mt-1" id="statusText">Render 클라우드 파이프라인 접속 시도 중</p>
      </div>
    </div>
    
    <!-- 도착 언어 선택 -->
    <select id="targetLang" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-2 py-1.5 focus:outline-none focus:border-indigo-500">
      <option value="en">🇺🇸 영어 (EN)</option>
      <option value="ja">🇯🇵 일본어 (JA)</option>
      <option value="zh-CN">🇨🇳 중국어 (ZH)</option>
      <option value="es">🇪🇸 스페인어 (ES)</option>
    </select>
  </header>

  <!-- 대화창 영역 -->
  <main id="chatContainer" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3">
    <!-- 초기 안내 화면 -->
    <div id="emptyGuide" class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400">
      <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-3 text-emerald-400 text-xl shadow-inner">
        <i class="fa-brands fa-youtube"></i>
      </div>
      <h2 class="text-sm font-semibold text-slate-200 mb-1">서버 자동 수신 모드</h2>
      <p class="text-xs max-w-xs text-slate-400 leading-relaxed mb-4">
        마이크 조작 없이 서버가 유튜브 실시간 음성을 직접 추출하여 5초 단위로 통역을 화면에 띄웁니다.
      </p>
    </div>

    <!-- 번역 카드 목록 -->
    <div id="messagesList" class="space-y-3"></div>
    <div id="scrollAnchor" class="h-1"></div>
  </main>

  <!-- 하단 고정 컨트롤 바 -->
  <footer class="p-3 bg-slate-900 border-t border-slate-800 shrink-0 z-30" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
    <div class="max-w-xl mx-auto flex items-center gap-2">
      <!-- 로컬 마이크 버튼 (비상용) -->
      <div class="relative shrink-0">
        <button id="micBtn" title="내 목소리 직접 통역" class="w-11 h-11 rounded-full bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 border border-slate-700 flex items-center justify-center transition shadow-md">
          <i class="fa-solid fa-microphone text-base"></i>
        </button>
        <span id="micRing" class="hidden absolute -inset-1 rounded-full border-2 border-red-500 mic-live-ring pointer-events-none"></span>
      </div>

      <!-- 수동 텍스트 입력창 -->
      <div class="relative flex-1">
        <input type="text" id="textInput" placeholder="직접 문장을 입력하여 테스트..." 
          class="w-full bg-slate-950 border border-slate-700 rounded-full px-4 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition pr-9">
        <button id="sendBtn" class="absolute right-1 top-1 w-7 h-7 rounded-full bg-indigo-600 active:bg-indigo-700 text-white flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const messagesList = document.getElementById('messagesList');
    const emptyGuide = document.getElementById('emptyGuide');
    const scrollAnchor = document.getElementById('scrollAnchor');
    const serverBadge = document.getElementById('serverBadge');
    const statusText = document.getElementById('statusText');
    const targetLangSelect = document.getElementById('targetLang');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const micRing = document.getElementById('micRing');

    // 배포된 Render 웹소켓 서버 주소
    const RENDER_WS_URL = "wss://server-1fjl.onrender.com/ws";
    let socket = null;

    function scrollToBottom() {
      setTimeout(() => {
        scrollAnchor.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 50);
    }

    // 서버 수신 통역 카드 렌더링
    function renderServerCard(original, translated) {
      emptyGuide.classList.add('hidden');
      const cardId = 'card-' + Date.now();
      const targetLangName = targetLangSelect.options[targetLangSelect.selectedIndex].text;

      const cardHtml = `
        <div id="${cardId}" class="flex flex-col space-y-1.5 border border-emerald-500/40 bg-slate-900/90 rounded-xl p-3 shadow-md">
          <div class="flex items-start justify-between gap-2 border-b border-slate-800 pb-1.5">
            <span class="text-[10px] text-emerald-400 font-medium flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>YouTube LIVE 음성
            </span>
            <span class="text-[9px] text-slate-500">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</span>
          </div>
          <div class="text-xs text-slate-200 font-medium leading-relaxed">${original}</div>
          <div class="pt-1 border-t border-slate-800/40">
            <div class="flex items-center justify-between text-[10px] text-indigo-400 font-medium mb-0.5">
              <span>${targetLangName}</span>
              <button onclick="navigator.clipboard.writeText(this.closest('#${cardId}').querySelector('.trans-result').innerText)" class="text-[9px] text-slate-500 hover:text-slate-300">
                <i class="fa-regular fa-copy"></i> 복사
              </button>
            </div>
            <div class="trans-result text-xs text-indigo-200 font-semibold leading-relaxed">${translated}</div>
          </div>
        </div>
      `;

      messagesList.insertAdjacentHTML('beforeend', cardHtml);
      scrollToBottom();
    }

    // 웹소켓 연결 관리
    function connectWebSocket() {
      serverBadge.innerText = "서버 연결 중...";
      serverBadge.className = "px-1.5 py-0.5 text-[9px] font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded-full animate-pulse";
      statusText.innerText = "Render 서버와 연결을 맺고 있습니다...";

      socket = new WebSocket(RENDER_WS_URL);

      socket.onopen = () => {
        serverBadge.innerText = "LIVE 수신 중";
        serverBadge.className = "px-1.5 py-0.5 text-[9px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full";
        statusText.innerText = "유튜브 라이브 스트림 수신 대기 완료";
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.original && data.translated) {
            renderServerCard(data.original, data.translated);
          }
        } catch (e) {
          console.error("데이터 수신 오류:", e);
        }
      };

      socket.onclose = () => {
        serverBadge.innerText = "연결 끊김 (재시도 중)";
        serverBadge.className = "px-1.5 py-0.5 text-[9px] font-semibold bg-red-500/20 text-red-400 border border-red-500/40 rounded-full";
        statusText.innerText = "서버 재연결 대기 중 (3초 후 재시도)...";
        setTimeout(connectWebSocket, 3000);
      };

      socket.onerror = (err) => {
        console.warn("WebSocket 연결 상태:", err);
      };
    }

    // 직접 텍스트 번역 API
    async function translateText(text, targetLang) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data[0]) {
          return data[0].map(item => item[0]).join('');
        }
      } catch (err) {}
      return text;
    }

    // 텍스트 수동 입력 전송
    async function handleSend() {
      const text = textInput.value.trim();
      if (!text) return;
      textInput.value = '';
      const targetLang = targetLangSelect.value;
      const trans = await translateText(text, targetLang);
      renderServerCard(text, trans);
    }

    sendBtn.addEventListener('click', handleSend);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSend();
    });

    // 페이지 진입 즉시 서버 연결
    connectWebSocket();
  </script>
</body>
</html>
