<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실시간 AI 라이브 통역기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020617;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.18); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .mic-live-ring {
      animation: pulse-ring 1.8s infinite ease-in-out;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="flex flex-col text-slate-100 font-sans" style="height: 100dvh;">

  <!-- 헤더 영역 -->
  <header class="flex items-center justify-between px-4 py-2.5 bg-slate-900/90 backdrop-blur border-b border-slate-800 shrink-0 z-30">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center shadow-md shadow-indigo-500/20">
        <i class="fa-solid fa-language text-white text-sm"></i>
      </div>
      <div>
        <h1 class="font-bold text-xs leading-none flex items-center gap-1.5 text-slate-100">
          실시간 라이브 통역기
          <span id="liveBadge" class="hidden px-1.5 py-0.5 text-[9px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full animate-pulse">LIVE</span>
        </h1>
        <p class="text-[10px] text-slate-400 mt-1" id="statusText">마이크를 켜면 긴 문장도 알아서 분할 번역합니다</p>
      </div>
    </div>
    
    <!-- 도착 언어 선택 -->
    <select id="targetLang" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-2 py-1.5 focus:outline-none focus:border-indigo-500">
      <option value="en">🇺🇸 영어 (EN)</option>
      <option value="ja">🇯🇵 일본어 (JA)</option>
      <option value="zh-CN">🇨🇳 중국어 (ZH)</option>
      <option value="es">🇪🇸 스페인어 (ES)</option>
    </select>
  </header>

  <!-- 대화창 영역 -->
  <main id="chatContainer" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3">
    <!-- 초기 안내 화면 -->
    <div id="emptyGuide" class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400">
      <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-3 text-indigo-400 text-xl shadow-inner">
        <i class="fa-solid fa-tower-broadcast"></i>
      </div>
      <h2 class="text-sm font-semibold text-slate-200 mb-1">스마트 실시간 연속 통역</h2>
      <p class="text-xs max-w-xs text-slate-400 leading-relaxed mb-4">
        긴 문장을 자연스러운 절 단위로 끊어 실시간 자막을 생성합니다.
      </p>
    </div>

    <!-- 번역 완료 카드 목록 -->
    <div id="messagesList" class="space-y-3"></div>

    <!-- 실시간 타이핑 프리뷰 카드 (말하는 도중 임시 표시) -->
    <div id="liveStreamCard" class="hidden border border-indigo-500/30 bg-indigo-950/20 rounded-xl p-3 shadow-sm">
      <div class="flex items-center gap-1.5 text-[10px] text-indigo-400 font-medium mb-1">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-ping"></span>
        <span>실시간 인식 중...</span>
      </div>
      <div id="liveStreamText" class="text-xs text-indigo-100 font-medium leading-relaxed italic"></div>
    </div>

    <div id="scrollAnchor" class="h-1"></div>
  </main>

  <!-- 하단 고정 컨트롤 바 -->
  <footer class="p-3 bg-slate-900 border-t border-slate-800 shrink-0 z-30" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
    <div class="max-w-xl mx-auto flex items-center gap-2">
      <!-- 마이크 토글 버튼 -->
      <div class="relative shrink-0">
        <button id="micBtn" class="w-11 h-11 rounded-full bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 border border-slate-700 flex items-center justify-center transition shadow-md">
          <i class="fa-solid fa-microphone text-base"></i>
        </button>
        <span id="micRing" class="hidden absolute -inset-1 rounded-full border-2 border-red-500 mic-live-ring pointer-events-none"></span>
      </div>

      <!-- 텍스트 직접 입력창 -->
      <div class="relative flex-1">
        <input type="text" id="textInput" placeholder="마이크를 켜거나 직접 문장을 입력하세요..." 
          class="w-full bg-slate-950 border border-slate-700 rounded-full px-4 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition pr-9">
        <button id="sendBtn" class="absolute right-1 top-1 w-7 h-7 rounded-full bg-indigo-600 active:bg-indigo-700 text-white flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const messagesList = document.getElementById('messagesList');
    const emptyGuide = document.getElementById('emptyGuide');
    const scrollAnchor = document.getElementById('scrollAnchor');
    const liveStreamCard = document.getElementById('liveStreamCard');
    const liveStreamText = document.getElementById('liveStreamText');
    const micBtn = document.getElementById('micBtn');
    const micRing = document.getElementById('micRing');
    const statusText = document.getElementById('statusText');
    const liveBadge = document.getElementById('liveBadge');
    const targetLangSelect = document.getElementById('targetLang');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');

    let recognition = null;
    let isContinuousListening = false;
    let restartTimer = null;
    let silenceTimer = null;

    // 실시간 음성 분할 제어 변수
    let currentResultIndex = -1;
    let dispatchedCharCount = 0;

    // NMT 신경망 번역 API 호출
    async function translateText(text, targetLang) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data[0]) {
          return data[0].map(item => item[0]).join('');
        }
      } catch (err) {
        console.warn('번역 API 오류:', err);
      }
      return text;
    }

    function scrollToBottom() {
      setTimeout(() => {
        scrollAnchor.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 50);
    }

    // 실시간 프리뷰 카드 업데이트
    function updateLivePreview(text) {
      if (!text || text.trim().length === 0) {
        liveStreamCard.classList.add('hidden');
        liveStreamText.innerText = '';
      } else {
        emptyGuide.classList.add('hidden');
        liveStreamCard.classList.remove('hidden');
        liveStreamText.innerText = text;
        scrollToBottom();
      }
    }

    // 확정된 텍스트 카드 생성 및 번역 요청
    async function createTranslationCard(originalText) {
      const cleanText = originalText.trim();
      if (!cleanText) return;
      emptyGuide.classList.add('hidden');

      const cardId = 'card-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
      const targetLang = targetLangSelect.value;
      const targetLangName = targetLangSelect.options[targetLangSelect.selectedIndex].text;

      const cardHtml = `
        <div id="${cardId}" class="flex flex-col space-y-1.5 border border-slate-800 bg-slate-900/80 rounded-xl p-3 shadow-sm">
          <div class="flex items-start justify-between gap-2 border-b border-slate-800/60 pb-1.5">
            <span class="text-[10px] text-slate-400 font-medium flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>한국어 원문
            </span>
            <span class="text-[9px] text-slate-500">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</span>
          </div>
          <div class="text-xs text-slate-200 font-medium leading-relaxed">${cleanText}</div>
          <div class="pt-1 border-t border-slate-800/40">
            <div class="flex items-center justify-between text-[10px] text-indigo-400 font-medium mb-0.5">
              <span>${targetLangName}</span>
              <button onclick="navigator.clipboard.writeText(this.closest('#${cardId}').querySelector('.trans-result').innerText)" class="text-[9px] text-slate-500 hover:text-slate-300">
                <i class="fa-regular fa-copy"></i> 복사
              </button>
            </div>
            <div class="trans-result text-xs text-indigo-200 font-semibold leading-relaxed">
              <span class="inline-flex items-center gap-1 text-slate-400 text-[11px]">
                <i class="fa-solid fa-circle-notch fa-spin"></i> 번역 중...
              </span>
            </div>
          </div>
        </div>
      `;

      messagesList.insertAdjacentHTML('beforeend', cardHtml);
      scrollToBottom();

      const translated = await translateText(cleanText, targetLang);
      const cardElem = document.getElementById(cardId);
      if (cardElem) {
        cardElem.querySelector('.trans-result').innerText = translated;
        scrollToBottom();
      }
    }

    // 스마트 문장 분할 처리 엔진
    function processSpeechChunk(fullTranscript, isFinal) {
      let rawRemaining = fullTranscript.slice(dispatchedCharCount);

      // 한국어 자연스러운 절 구분 정규식 (문장부호, 접속·연결 어미)
      const clauseRegex = /([.?!,]|(?<=[가-힣]{2,})(?:고|며|는데|은데|ㄴ데|지만|으나|어서|아서|여서|므로|면서|으며|구요|고요|대요))\s+/;

      let match;
      while ((match = clauseRegex.exec(rawRemaining)) !== null) {
        const breakEndPos = match.index + match[0].length;
        const candidate = rawRemaining.slice(0, breakEndPos).trim();

        // 12자 이상이거나 3단어 이상일 때 의미 있는 덩어리로 판단하여 분할
        if (candidate.length >= 12 || candidate.split(/\s+/).length >= 3) {
          createTranslationCard(candidate);
          dispatchedCharCount += breakEndPos;
          rawRemaining = fullTranscript.slice(dispatchedCharCount);
        } else {
          break;
        }
      }

      // 글자 수 임계치 분할 (부호 없이 35자 이상 길어질 경우 띄어쓰기 위치에서 강제 분할)
      if (rawRemaining.trim().length >= 35) {
        const lastSpace = rawRemaining.slice(0, 35).lastIndexOf(' ');
        if (lastSpace >= 12) {
          const chunk = rawRemaining.slice(0, lastSpace).trim();
          createTranslationCard(chunk);
          dispatchedCharCount += (lastSpace + 1);
          rawRemaining = fullTranscript.slice(dispatchedCharCount);
        }
      }

      const currentLive = rawRemaining.trim();

      if (isFinal) {
        clearTimeout(silenceTimer);
        if (currentLive.length > 0) {
          createTranslationCard(currentLive);
        }
        dispatchedCharCount = 0;
        updateLivePreview('');
      } else {
        updateLivePreview(currentLive);

        // 무음 감지 (1.1초 동안 새로운 어절이 없으면 현재 조각 즉시 번역 확정)
        clearTimeout(silenceTimer);
        if (currentLive.length >= 5) {
          silenceTimer = setTimeout(() => {
            const latestPending = fullTranscript.slice(dispatchedCharCount).trim();
            if (latestPending.length > 0) {
              createTranslationCard(latestPending);
              dispatchedCharCount = fullTranscript.length;
              updateLivePreview('');
            }
          }, 1100);
        }
      }
    }

    // 음성 인식 초기화 (interimResults: true 로 실시간 스트리밍 감지)
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusText.innerText = "이 브라우저는 음성 인식을 지원하지 않습니다.";
        return null;
      }

      const recognizer = new SpeechRecognition();
      recognizer.lang = 'ko-KR';
      recognizer.continuous = true;
      recognizer.interimResults = true; // 실시간 발화 조각 수신

      recognizer.onstart = () => {
        statusText.innerText = "음성을 실시간 감지 중입니다...";
        liveBadge.classList.remove('hidden');
        micBtn.classList.replace('bg-slate-800', 'bg-red-600');
        micBtn.classList.replace('text-slate-300', 'text-white');
        micRing.classList.remove('hidden');
      };

      recognizer.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (i !== currentResultIndex) {
            currentResultIndex = i;
            dispatchedCharCount = 0;
          }
          const isFinal = event.results[i].isFinal;
          const fullTranscript = event.results[i][0].transcript;
          processSpeechChunk(fullTranscript, isFinal);
        }
      };

      recognizer.onerror = (event) => {
        if (event.error !== 'no-speech') {
          console.log('마이크 상태:', event.error);
        }
      };

      recognizer.onend = () => {
        if (isContinuousListening) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            try { recognizer.start(); } catch (err) {}
          }, 100);
        } else {
          statusText.innerText = "마이크가 대기 상태입니다";
          liveBadge.classList.add('hidden');
          micBtn.classList.replace('bg-red-600', 'bg-slate-800');
          micBtn.classList.replace('text-white', 'text-slate-300');
          micRing.classList.add('hidden');
          updateLivePreview('');
        }
      };

      return recognizer;
    }

    function toggleMic() {
      if (!recognition) {
        recognition = initSpeechRecognition();
        if (!recognition) return;
      }

      if (isContinuousListening) {
        isContinuousListening = false;
        recognition.stop();
        updateLivePreview('');
      } else {
        isContinuousListening = true;
        currentResultIndex = -1;
        dispatchedCharCount = 0;
        try { recognition.start(); } catch (e) {}
      }
    }

    micBtn.addEventListener('click', toggleMic);

    // 텍스트 직접 입력 처리 (문장이 길면 줄바꿈/마침표 기준으로 분할 처리)
    function handleSend() {
      const text = textInput.value.trim();
      if (!text) return;

      const sentences = text.split(/(?<=[.?!])\s+/);
      sentences.forEach(s => {
        if (s.trim()) createTranslationCard(s.trim());
      });
      textInput.value = '';
    }

    sendBtn.addEventListener('click', handleSend);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSend();
    });
  </script>
</body>
</html>
